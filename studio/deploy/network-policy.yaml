apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voicecan-studio-local-full
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: voicecan-studio-local-full
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              voicecan.network/ingress: "true"
      ports:
        - { protocol: TCP, port: 8815 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              voicecan.network/device-platform: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: voicecan-device-platform
      ports:
        - { protocol: TCP, port: 8787 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
